<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="流程：用户的任务先判断值得派吗。不值得就由主路由自己做。值得就选子 agent、模型和强度，写派工单，子 agent 在专用 worktree 或只读沙箱里执行，脚本判定版本、命令和内容变化，子 agent 在只读沙箱里判读，最后主路由抽查并合并。">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.6" stop-color="#151a3a"/>
      <stop offset="1" stop-color="#1e1a45"/>
    </linearGradient>
    <linearGradient id="routerFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="800" height="340" rx="18" fill="url(#bg)"/>

  <g fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M150 66 L176 66"/>
    <path d="M304 66 L346 66"/>
    <path d="M550 66 L596 66"/>
    <path d="M240 104 L240 148"/>
    <path d="M685 90 L685 148"/>
    <path d="M685 204 L685 248"/>
    <path d="M592 276 L532 276"/>
    <path d="M340 276 L280 276"/>
  </g>

  <g font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" text-anchor="middle">
    <rect x="30" y="42" width="120" height="48" rx="10" fill="#1e293b" stroke="#64748b"/>
    <text x="90" y="71" font-size="14" fill="#e2e8f0">用户的任务</text>

    <polygon points="178,66 240,28 302,66 240,104" fill="#2e2a6b" stroke="#a78bfa"/>
    <text x="240" y="71" font-size="14" fill="#ffffff">值得派吗</text>
    <text x="324" y="56" font-size="12" fill="#cbd5e1">是</text>
    <text x="256" y="130" font-size="12" fill="#cbd5e1">否</text>

    <rect x="350" y="42" width="200" height="48" rx="10" fill="#2e2a6b" stroke="#a78bfa"/>
    <text x="450" y="71" font-size="14" fill="#ffffff">选子 agent、模型和强度</text>

    <rect x="600" y="42" width="170" height="48" rx="10" fill="#2e2a6b" stroke="#a78bfa"/>
    <text x="685" y="71" font-size="14" fill="#ffffff">写派工单</text>

    <rect x="170" y="152" width="140" height="44" rx="10" fill="#2e2a6b" stroke="#a78bfa"/>
    <text x="240" y="179" font-size="14" fill="#ffffff">主路由自己做</text>

    <rect x="596" y="152" width="178" height="52" rx="10" fill="#0f1b33" stroke="#60a5fa"/>
    <text x="685" y="174" font-size="14" fill="#bfdbfe">子 agent 执行</text>
    <text x="685" y="193" font-size="11.5" fill="#93c5fd">专用 worktree 或只读沙箱</text>

    <rect x="596" y="252" width="178" height="52" rx="10" fill="#0d2a22" stroke="#34d399"/>
    <text x="685" y="274" font-size="14" fill="#a7f3d0">脚本判定</text>
    <text x="685" y="293" font-size="11.5" fill="#6ee7b7">版本、命令、内容变化</text>

    <rect x="344" y="252" width="184" height="52" rx="10" fill="#2a2110" stroke="#fbbf24"/>
    <text x="436" y="274" font-size="14" fill="#fde68a">只读判读</text>
    <text x="436" y="293" font-size="11.5" fill="#fcd34d">子 agent 写不了文件</text>

    <rect x="96" y="252" width="184" height="52" rx="10" fill="url(#routerFill)"/>
    <text x="188" y="283" font-size="14" font-weight="600" fill="#ffffff">主路由抽查，合并</text>
  </g>
</svg>
